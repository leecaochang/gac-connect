name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install library and all test extras
        run: python -m pip install '.[cli,dev]'
      - name: Offline regression tests
        run: python -m pytest -q
      - name: Static checks
        run: ruff check .
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Smoke test the installed artifact outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/gac-wheel"
          "$RUNNER_TEMP/gac-wheel/bin/python" -m pip install "$GITHUB_WORKSPACE"/dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/gac-wheel/bin/python" -I "$GITHUB_WORKSPACE/tests/wheel_smoke.py"
